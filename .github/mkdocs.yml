site_name: RPGVault manual
site_description: The practical manual for an upgradeable tabletop RPG vault
site_url: https://jakrog01.github.io/RPGVault/
docs_dir: ../docs
site_dir: ../.github/site
theme:
  name: material
  language: en
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.top
    - navigation.path
    - navigation.footer
    - search.highlight
    - search.suggest
    - search.share
    - toc.follow
    - content.code.copy
  palette:
    - scheme: slate
      primary: deep purple
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to light mode
    - scheme: default
      primary: deep purple
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to dark mode
markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
plugins:
  - search
nav:
  - Getting started: GETTING-STARTED.md
  - RPGVault concepts: CONCEPTS.md
  - Architecture: ARCHITECTURE.md
  - CLI reference: CLI.md
  - Troubleshooting: TROUBLESHOOTING.md
  - Table home: HOME.md
  - Table Tools at the table: TABLE-TOOLS.md
  - Table Tools settings: SETTINGS.md
  - Assistant retrieval: ASSISTANT.md
  - Customising Table Tools: CUSTOMISING.md
  - Authoring systems: AUTHORING-SYSTEMS.md
  - Adopting an Existing Vault: ADOPTING.md
  - Keeping a vault up to date: UPDATING.md
  - Maintaining releases: UPGRADING.md
  - "ADR 0001: release zip plus migrations": adr/0001-update-mechanism.md
  - "ADR 0002: active run pointer location": adr/0002-active-pointer-location.md
  - "ADR 0003: assistant retrieval": adr/0003-assistant-retrieval.md
