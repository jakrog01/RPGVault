name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: npm test
      - run: zip -r RPGVault.zip . -x '.git/*' '.rpgvault/backups/*'
      - uses: softprops/action-gh-release@v2
        with:
          files: RPGVault.zip
